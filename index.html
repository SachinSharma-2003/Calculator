<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            font-family: 'Poppins', sans-serif;
        }

        .calculator {
            width: 340px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.6s ease-in-out;
        }

        .display {
            height: 70px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            color: #00ffcc;
            font-size: 32px;
            font-weight: bold;
            text-align: right;
            padding: 15px;
            margin-bottom: 20px;
            overflow-x: auto;
            box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.6);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-number {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-number:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-operator {
            background: #ff8c00;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.6);
        }

        .btn-operator:hover {
            background: #e67e00;
        }

        .btn-clear {
            background: #e63946;
            color: #fff;
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.6);
        }

        .btn-clear:hover {
            background: #c92f3b;
        }

        .btn-backspace {
            background: #4a4e69;
            color: #fff;
            box-shadow: 0 0 10px rgba(74, 78, 105, 0.6);
        }

        .btn-backspace:hover {
            background: #343650;
        }

        .btn-equal {
            background: #06d6a0;
            color: #fff;
            grid-column: span 2;
            box-shadow: 0 0 12px rgba(6, 214, 160, 0.6);
        }

        .btn-equal:hover {
            background: #05b68a;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-backspace" onclick="backspace()">⌫</button>
            <button class="btn-operator" onclick="appendOperator('/')">÷</button>
            <button class="btn-operator" onclick="appendOperator('*')">×</button>

            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="appendOperator('-')">−</button>

            <button class="btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn-operator" onclick="appendOperator('+')">+</button>

            <button class="btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn-operator" onclick="appendOperator('.')">.</button>

            <button class="btn-number" style="grid-column: span 2;" onclick="appendNumber('0')">0</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById("display");
        let currentInput = "";

        function appendNumber(num) {
            if (currentInput === "0") {
                currentInput = num;
            } else {
                currentInput += num;
            }
            display.innerText = currentInput;
        }

        function appendOperator(op) {
            if (currentInput === "" && op !== "-") return;
            currentInput += op;
            display.innerText = currentInput;
        }

        function clearDisplay() {
            currentInput = "";
            display.innerText = "0";
        }

        function backspace() {
            currentInput = currentInput.slice(0, -1);
            display.innerText = currentInput || "0";
        }

        function calculate() {
            try {
                let result = eval(currentInput);
                display.innerText = result;
                currentInput = result.toString();
            } catch {
                display.innerText = "Error";
                currentInput = "";
            }
        }
    </script>
</body>

</html>
